<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seeker Web - 生物探索掃描器</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none; /* 防止 Safari 橡皮筋下拉 */
    }

    /* 滿版相機畫面 */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      z-index: 1;
    }

    /* Seek 風格的圓形掃描框 */
    .scan-reticle {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 3px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .scan-reticle.processing {
      border-color: #10b981;
      border-style: solid;
      animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7), 0 0 0 2000px rgba(0, 0, 0, 0.35); }
      70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0), 0 0 0 2000px rgba(0, 0, 0, 0.35); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0), 0 0 0 2000px rgba(0, 0, 0, 0.35); }
    }

    /* 掃描雷達網格動畫 */
    .radar-scan {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(to bottom, transparent 48%, #10b981 50%, transparent 52%);
      background-size: 100% 200%;
      animation: radar-sweep 2s linear infinite;
      display: none;
      opacity: 0.5;
    }

    .processing .radar-scan {
      display: block;
    }

    @keyframes radar-sweep {
      0% { background-position: 0% -100%; }
      100% { background-position: 0% 200%; }
    }

    /* 底部面板滑出動畫 */
    .bottom-sheet {
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.3, 0.9, 0.4, 1);
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }

    /* 分類階層連線 */
    .taxon-line {
      position: absolute;
      left: 11px;
      top: 24px;
      bottom: -10px;
      width: 2px;
      background-color: #cbd5e1;
      z-index: 0;
    }

    /* 隱藏捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Toast 提示框 */
    .toast {
      transform: translateY(-150%);
      transition: transform 0.3s cubic-bezier(0.3, 0.9, 0.4, 1);
    }
    .toast.show {
      transform: translateY(0);
    }
  </style>
</head>
<body class="text-slate-800 selection:bg-emerald-200">

  <!-- 1. 相機視訊層 -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- 2. UI 覆蓋層 -->
  <div class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none">
    
    <!-- 頂部列 -->
    <header class="p-5 pt-8 bg-gradient-to-b from-black/60 to-transparent pointer-events-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white shadow-lg">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <span class="font-bold text-white tracking-wider text-shadow">Seeker Web</span>
      </div>
      
      <!-- GPS 切換 -->
      <button id="gpsBtn" onclick="toggleGPS()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur border border-white/30 flex items-center justify-center transition active:scale-90 shadow-sm">
        <i id="gpsIcon" class="fa-solid fa-location-crosshairs text-white"></i>
      </button>
    </header>

    <!-- 中央掃描區 -->
    <div id="scanReticle" class="scan-reticle pointer-events-auto">
      <div class="radar-scan"></div>
    </div>

    <!-- 底部控制列 -->
    <footer class="p-6 pb-10 bg-gradient-to-t from-black/80 to-transparent flex flex-col items-center justify-end pointer-events-auto relative z-20">
      <p id="instructionText" class="mb-6 text-sm font-medium text-white bg-black/50 px-5 py-2 rounded-full backdrop-blur-md border border-white/10 shadow-lg">
        請將動植物置於圓框內並保持穩定
      </p>
      
      <!-- 快門按鈕 -->
      <button id="shutterBtn" onclick="captureAndAnalyze()" class="relative w-20 h-20 rounded-full border-[5px] border-white/80 bg-white/30 backdrop-blur flex items-center justify-center transition-transform active:scale-95 shadow-xl">
        <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-emerald-600 shadow-inner">
          <i id="shutterIcon" class="fa-solid fa-camera text-2xl"></i>
        </div>
      </button>
    </footer>
  </div>

  <!-- 3. 辨識結果底板 (Bottom Sheet) -->
  <div id="resultSheet" class="fixed inset-x-0 bottom-0 z-50 h-[75dvh] bg-white rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.3)] bottom-sheet flex flex-col">
    <!-- 拖曳把手 -->
    <div class="w-full flex justify-center pt-4 pb-2 cursor-pointer" onclick="closeResult()">
      <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
    </div>
    
    <div class="px-6 pb-3 flex justify-between items-start">
      <div class="flex-1 pr-4">
        <span id="matchLevelBadge" class="inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mb-2 bg-emerald-100 text-emerald-800">
          物種級別相符
        </span>
        <h2 id="resultName" class="text-2xl font-black text-slate-900 leading-tight">辨識中...</h2>
        <p id="resultSciName" class="text-sm text-slate-500 italic mt-0.5">Scientific Name</p>
      </div>
      <!-- 物種縮圖 -->
      <img id="resultImage" src="https://placehold.co/100x100/e2e8f0/94a3b8?text=Photo" alt="Species" class="w-20 h-20 rounded-2xl object-cover shadow-md border border-slate-100">
    </div>

    <!-- 分類階層樹 (Taxonomy Tree) -->
    <div class="flex-1 overflow-y-auto px-6 py-2 no-scrollbar bg-slate-50 border-t border-slate-100 relative">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 mt-2">生物分類階層 (Taxonomy)</h3>
      
      <div id="taxonomyTree" class="relative pb-6">
        <!-- 階層項目將由 JS 動態生成 -->
      </div>
    </div>

    <!-- 底部操作列 -->
    <div class="p-5 bg-white border-t border-slate-100 flex gap-3">
      <button onclick="closeResult()" class="flex-1 py-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition active:scale-95">
        重新掃描
      </button>
      <a id="iNatLink" href="#" target="_blank" class="flex-1 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm transition active:scale-95 text-center flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20">
        <i class="fa-solid fa-book-open"></i> 完整百科
      </a>
    </div>
  </div>

  <!-- 4. 自訂 Toast 提示 (取代 alert) -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[60] bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 toast border border-slate-700">
    <i id="toastIcon" class="fa-solid fa-circle-info text-emerald-400"></i>
    <span id="toastMsg" class="text-sm font-medium">訊息</span>
  </div>

  <!-- 隱藏的 Canvas 用於擷取畫面 -->
  <canvas id="captureCanvas" class="hidden"></canvas>


  <script>
    // === DOM 元素 ===
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('captureCanvas');
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterIcon = document.getElementById('shutterIcon');
    const scanReticle = document.getElementById('scanReticle');
    const instructionText = document.getElementById('instructionText');
    const resultSheet = document.getElementById('resultSheet');
    
    // Toast
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    let stream = null;
    let isProcessing = false;
    
    // GPS 狀態
    let userLat = null; 
    let userLng = null;
    let gpsEnabled = false;

    // 分類位階的中英對照表
    const rankTranslation = {
      'kingdom': '界',
      'phylum': '門',
      'class': '綱',
      'order': '目',
      'family': '科',
      'genus': '屬',
      'species': '種',
      'subspecies': '亞種'
    };

    // 顯示 Toast 提示
    function showToast(msg, type = 'info') {
      toastMsg.innerText = msg;
      toastIcon.className = type === 'error' 
        ? "fa-solid fa-circle-xmark text-rose-400" 
        : type === 'success' 
          ? "fa-solid fa-circle-check text-emerald-400"
          : "fa-solid fa-circle-info text-sky-400";
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // 啟動相機
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Camera error:", err);
        showToast("無法存取相機，請確認瀏覽器權限", "error");
        instructionText.innerText = "相機權限遭拒";
        instructionText.classList.replace('bg-black/50', 'bg-rose-500/80');
      }
    }

    // 切換 GPS 定位
    function toggleGPS() {
      const icon = document.getElementById('gpsIcon');
      const btn = document.getElementById('gpsBtn');

      if (!gpsEnabled) {
        if ("geolocation" in navigator) {
          icon.className = "fa-solid fa-spinner fa-spin text-emerald-400";
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              userLat = pos.coords.latitude;
              userLng = pos.coords.longitude;
              gpsEnabled = true;
              icon.className = "fa-solid fa-location-crosshairs text-emerald-400";
              btn.classList.add('border-emerald-400', 'bg-emerald-500/20');
              showToast("已啟用定位，辨識將更精準", "success");
            },
            (err) => {
              icon.className = "fa-solid fa-location-crosshairs text-white";
              showToast("定位失敗，將使用全域搜尋", "error");
            },
            { timeout: 5000 }
          );
        } else {
          showToast("您的設備不支援定位", "error");
        }
      } else {
        gpsEnabled = false;
        userLat = null;
        userLng = null;
        icon.className = "fa-solid fa-location-crosshairs text-white";
        btn.classList.remove('border-emerald-400', 'bg-emerald-500/20');
        showToast("已關閉定位輔助", "info");
      }
    }

    // 擷取畫面並呼叫 API
    async function captureAndAnalyze() {
      if (isProcessing || !stream) return;
      isProcessing = true;

      // 1. UI 進入掃描狀態
      shutterIcon.className = "fa-solid fa-spinner fa-spin";
      scanReticle.classList.add('processing');
      instructionText.innerText = "AI 正在分析影像特徵...";
      
      try {
        // 2. 擷取影片畫面至 Canvas
        // 為了效能，我們不需要太大的原圖，800px 夠了
        canvas.width = 800;
        canvas.height = (video.videoHeight / video.videoWidth) * 800;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 3. 轉成 JPEG Blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

        // 4. 組裝 iNaturalist API Payload
        const formData = new FormData();
        formData.append('image', blob, 'capture.jpg');
        if (gpsEnabled && userLat && userLng) {
          formData.append('lat', userLat);
          formData.append('lng', userLng);
        }

        // 5. 呼叫 iNaturalist Computer Vision Endpoint
        const response = await fetch('https://api.inaturalist.org/v1/computervision/score_image', {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
          renderResult(data.results[0]);
        } else {
          showToast("找不到相符的物種特徵", "error");
          resetUI();
        }

      } catch (error) {
        console.error("API 錯誤:", error);
        showToast("網路連線異常或辨識失敗", "error");
        resetUI();
      }
    }

    // 渲染辨識結果與分類樹
    function renderResult(bestMatch) {
      const taxon = bestMatch.taxon;
      const score = (bestMatch.vision_score * 100).toFixed(1);
      
      // 取得顯示名稱
      const commonName = taxon.preferred_common_name || taxon.name;
      const sciName = taxon.name;
      const rank = taxon.rank; // e.g., 'species', 'genus', 'family'
      
      // 設定圖片
      const imgEl = document.getElementById('resultImage');
      if (taxon.default_photo && taxon.default_photo.medium_url) {
        imgEl.src = taxon.default_photo.medium_url;
      } else {
        imgEl.src = 'https://placehold.co/200x200/e2e8f0/94a3b8?text=No+Photo';
      }

      // 更新名稱與維基連結
      document.getElementById('resultName').innerText = commonName;
      document.getElementById('resultSciName').innerText = sciName;
      document.getElementById('iNatLink').href = `https://www.inaturalist.org/taxa/${taxon.id}`;

      // 判斷吻合層級 (Seek 特色：不一定能認到「種」)
      const badge = document.getElementById('matchLevelBadge');
      const translatedRank = rankTranslation[rank] || rank;
      
      if (rank === 'species' || rank === 'subspecies') {
        badge.innerText = `確信度 ${score}% | 物種相符`;
        badge.className = "inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mb-2 bg-emerald-100 text-emerald-800";
      } else {
        badge.innerText = `確信度 ${score}% | ${translatedRank}級別相符`;
        badge.className = "inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mb-2 bg-amber-100 text-amber-800";
      }

      // === 構建分類階層樹 (Taxonomy Tree) ===
      const treeContainer = document.getElementById('taxonomyTree');
      treeContainer.innerHTML = '<div class="taxon-line"></div>'; // 清空並重置連線

      // iNaturalist 的 ancestors 陣列包含了從「界」到該物種的所有節點
      let ancestorsToDisplay = [];
      if (taxon.ancestors && taxon.ancestors.length > 0) {
        // 過濾我們想顯示的主要階層
        const targetRanks = ['kingdom', 'phylum', 'class', 'order', 'family', 'genus'];
        ancestorsToDisplay = taxon.ancestors.filter(a => targetRanks.includes(a.rank));
      }
      
      // 把當前辨識到的節點加在最後面
      ancestorsToDisplay.push(taxon);

      ancestorsToDisplay.forEach((node, index) => {
        const isLast = index === ancestorsToDisplay.length - 1;
        const nodeRankZh = rankTranslation[node.rank] || node.rank;
        const nodeName = node.preferred_common_name || node.name;
        
        // 顏色邏輯：最後一個（最精準的節點）使用綠色高亮
        const dotColor = isLast ? 'bg-emerald-500 ring-4 ring-emerald-100' : 'bg-slate-300';
        const textColor = isLast ? 'text-emerald-700 font-bold' : 'text-slate-700 font-medium';
        const bgClass = isLast ? 'bg-white shadow-sm border border-emerald-100' : 'bg-transparent';

        const treeItem = `
          <div class="flex items-center gap-4 relative z-10 mb-2">
            <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 bg-slate-50">
              <div class="w-2.5 h-2.5 rounded-full ${dotColor}"></div>
            </div>
            <div class="flex-1 flex items-baseline gap-2 px-3 py-2 rounded-xl ${bgClass}">
              <span class="text-[10px] font-bold text-slate-400 w-4">${nodeRankZh}</span>
              <span class="text-sm ${textColor}">${nodeName}</span>
            </div>
          </div>
        `;
        treeContainer.insertAdjacentHTML('beforeend', treeItem);
      });

      // 播放成功音效 (Web Audio)
      playSuccessSound();

      // 打開 Bottom Sheet
      resultSheet.classList.add('open');
      instructionText.innerText = "往下滑動面板以繼續掃描";
      shutterIcon.className = "fa-solid fa-camera text-2xl";
      scanReticle.classList.remove('processing');
    }

    // 關閉面板並重置 UI
    function closeResult() {
      resultSheet.classList.remove('open');
      resetUI();
    }

    function resetUI() {
      isProcessing = false;
      instructionText.innerText = "請將動植物置於圓框內並保持穩定";
      shutterIcon.className = "fa-solid fa-camera text-2xl";
      scanReticle.classList.remove('processing');
    }

    // 簡單的成功提示音
    function playSuccessSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', initCamera);

  </script>
</body>
</html>
